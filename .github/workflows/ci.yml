name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    name: Build, Vet, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

      - name: Run unit & component tests with race detector
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Check build
        run: |
          go build ./cmd/server
          go build ./cmd/mockprovider

  docker-build:
    name: Docker Image Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build server Docker image
        run: docker build --target server -t notification-server:ci .

      - name: Build mockprovider Docker image
        run: docker build --target mockprovider -t mock-provider:ci .
